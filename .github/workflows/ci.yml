name: HWS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Configure CMake (Release)
        run: cmake --preset release

      - name: Build Project
        run: cmake --build --preset release

      - name: Run Unit Tests
        run: ctest -V --test-dir build/release --output-on-failure

      - name: Run E2E Smoke Test
        run: |
          # 1. Assemble a smoke test source file into a binary
          ./build/release/tools/assembler/hws_asm tests/smoke.asm smoke.bin
          
          # 2. Execute the compiled binary on the simulator
          ./build/release/hws_sim smoke.bin

      - name: Run Klaus Functional Test Suite
        run: |
          # Executes Klaus Dormann's test binary under release build with zero debug trace overhead
          timeout 30s ./build/release/hws_sim tests/6502_functional_test.bin 0400 || [ $? -eq 124 ]